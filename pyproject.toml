[project]
name = "sangop"
version = "2026.11.0"
description = "Local, deterministic PII/secret scrubbing, SQL guarding and tamper-evident audit logs for AI agent tools (MCP/FastMCP). No network, no telemetry."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["sqlglot>=28.5"]
keywords = ["mcp", "fastmcp", "pii", "dpdp", "ai-security", "owasp-llm", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2"]
policy = ["pyyaml>=6"]
dev = ["pytest>=8", "fastmcp>=2", "pyyaml>=6", "httpx>=0.28"]

[project.urls]
Homepage = "https://github.com/sangop-dev/sangop"
Issues = "https://github.com/sangop-dev/sangop/issues"

[project.scripts]
sangop = "sangop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sangop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: absolute timing checks that depend on the machine (run with: pytest -m slow)"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:SANGOP_LEDGER_KEY / ledger key looks weak:UserWarning"]   # older tests use short demo keys

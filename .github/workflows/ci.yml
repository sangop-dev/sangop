# Runs the test suite, the self-test and the pre-publish check on every push to main and on every pull request,
# on Linux and Windows with Python 3.10 to 3.13 (Windows added 13 Nov 2026 after the first Windows run found four
# test/tooling gaps; see CHANGELOG). It uses no secrets and no network service except the package index.
# Hardened 16 Nov 2026: every action is pinned to a full commit SHA (the version is in the comment; Dependabot
# proposes updates), checkout keeps no credentials, every job reads only, and a security job runs pip-audit
# (known vulnerabilities in the dependencies) and bandit (common security mistakes in src/).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (the machine-dependent timing tests marked "slow" are skipped by default)
        run: python -m pytest -q
      - name: Self-test
        run: sangop selftest
      - name: Pre-publish check
        run: python scripts/prepublish_check.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the package and the pinned security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pip-audit==2.10.1" "bandit==1.9.4"
      - name: pip-audit (known vulnerabilities in installed dependencies)
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: bandit (security linter on src/)
        run: python -m bandit -r src -q

# Active in the public repository: the public export publishes this file as .github/workflows/release.yml
# (D-122, 15 Nov 2026). In the private repository it keeps the .disabled ending and never runs.
# Builds from the public repository it runs in (never from a private copy) and refuses packages that carry a
# private file. Publishes to PyPI with Trusted Publishing (OpenID Connect): no PyPI password or API token is stored anywhere.
# Runs only when a version tag such as v0.1.4 is pushed, and the upload waits for a human approval on the
# "pypi" environment (set "Required reviewers" on that environment in the repository settings).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${VERSION}"; exit 1; }
      - name: Test before building
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python scripts/prepublish_check.py
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Nothing private in the packages
        run: |
          python - <<'PY'
          import sys, tarfile, zipfile, glob
          bad = ("_HI.md", "policies/", "private/", ".jsonl", "_PRIVATE.md", ".env", ".db",
                 "scripts/private_", "pro_markers.txt", "private_strings.txt", "make_public_export.py")
          names = []
          for w in glob.glob("dist/*.whl"):
              names += zipfile.ZipFile(w).namelist()
          for s in glob.glob("dist/*.tar.gz"):
              names += tarfile.open(s).getnames()
          hits = [n for n in names if any(b in n for b in bad)]
          print("\n".join(hits) or "clean")
          sys.exit(1 if hits else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sangop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

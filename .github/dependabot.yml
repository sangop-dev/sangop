# Once a week, opens pull requests for newer versions of the Python dependencies in pyproject.toml and of the
# GitHub Actions used by the workflows (they are pinned to commit SHAs; Dependabot updates the SHA and its version
# comment together). Nothing is merged automatically; every update goes through CI and a maintainer's review.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
